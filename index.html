# فكرة الدرع

## لماذا نتحدث عن القوة والضعف؟
> ﴿وَخُلِقَ الْإِنسَانُ ضَعِيفًا﴾ [النساء: 28]

يولد الإنسان ضعيفًا، ثم يقوى بما يفعل. كل فعل صحيح يقوّيه، وكل فعل خاطئ يُضعفه. هذه هي الفكرة كلها، وهي بسيطة بما يكفي ليفهمها طفل صغير.

## القوة ليست في العضلات
> قال النبي ﷺ: «ليس الشديدُ بالصُّرَعة، إنما الشديدُ الذي يملك نفسه عند الغضب» (متفق عليه)

لهذا لم نجعل رمز القوة عضلات أو انتصارًا على أحد. اخترنا **الدرع**: شيء يحمي صاحبه، ويُبنى قطعة قطعة بأفعاله.

## القوي والضعيف عندنا
- **الفعل القوي** هو كل فعل صحيح: مساعدة، صدق، صبر، صلاة، أكل مفيد، نوم مبكر… كل فعل قوي يركّب قطعة في الدرع.
- **الفعل الضعيف** هو كل فعل خاطئ: ضرب، صراخ، كذب، كسر اتفاق… كل فعل ضعيف يُحدث **شرخًا** في قطعة.
- نصف **الفعل** لا **الطفل**: نقول «هذا فعل ضعيف»، ولا نقول «أنت ضعيف».

## الإصلاح
> ﴿إِنَّ الْحَسَنَاتِ يُذْهِبْنَ السَّيِّئَاتِ﴾ [هود: 114]

الخطأ ليس نهاية الطريق. الاعتذار، أو إصلاح الخطأ، أو المسامحة، يلحم الشرخ ويعيد القطعة سليمة. نريد أن يتعلم الطفل أن الخطأ يُصلَح، لا أنه يُعاقَب فقط.

## الأكل والشاشة
- نسمّي الطعام غير المفيد «أكلًا ضعيفًا»، ونسمح بقليل منه **دون أن ينقص الدرع**.
- ما يُحدث شرخًا هو **كسر الاتفاق**: الأكل دون استئذان، أو تجاوز ما اتفقنا عليه.
- وكذلك الشاشة: المشاهدة المتفق عليها ليست ضعفًا، أما تجاوز الوقت أو الغضب عند الإغلاق فهو الفعل الضعيف.

> «المؤمن القوي خيرٌ وأحبُّ إلى الله من المؤمن الضعيف، وفي كلٍّ خير» (رواه مسلم)

# طريقة الاستخدام

## تثبيت التطبيق على الهاتف
افتح رابط الصفحة مرة واحدة، ثم أضفها إلى الشاشة الرئيسية لتصبح تطبيقًا بأيقونة، يعمل بملء الشاشة ودون إنترنت.
- **آيفون وآيباد (Safari):** اضغط زر المشاركة ⬆️ ← «إضافة إلى الشاشة الرئيسية» ← «إضافة».
- **أندرويد (Chrome):** اضغط «📲 ثبّت التطبيق» أعلى الصفحة، أو ⋮ ← «تثبيت التطبيق».
- على آيفون: التطبيق المثبّت له بيانات **منفصلة** عن Safari. إذا بدأت في Safari ثم ثبّت التطبيق، انقل تقدّمك بالنسخة الاحتياطية.

## أول مرة
1. اضغط «⚙️ للوالدين» أعلى الصفحة.
2. في «الأطفال»: عدّل الأسماء والألوان، وأضف صورة لكل طفل إن أردت، وأضف أطفالًا أو احذف.
3. حدد **عدد قطع الدرع** لكل طفل، وهو هدف اليوم.
4. راجع قوائم **الأفعال القوية** و**الأفعال الضعيفة** و**طرق الإصلاح**، وعدّلها لتناسب كلام بيتكم.
5. راجع **مهام الروتين**: 👁 تظهر المهمة للطفل، و🛡️ تجعلها تركّب قطعة.
6. اضغط «حفظ ورجوع».

## كل يوم
- **مهام الروتين:** يضغط الطفل على اسمه، ويعلّم على ما أنجزه، ثم «انتهيت». كل مهمة تركّب قطعة.
- **🛡️ فعل قوي:** اختر الفعل من القائمة، فتُركَّب قطعة.
- **⚡ فعل ضعيف:** اختر الفعل، فيظهر شرخ في قطعة.
- **🔧 إصلاح:** يعمل عندما يكون في الدرع شرخ. اختر طريقة الإصلاح، فيُلحم الشرخ.
- **📜 يومي:** سجل اليوم بالأفعال نفسها. جميل أن تراجعوه معًا قبل النوم.
- إذا لم تجد الفعل في القائمة، اكتبه في خانة «شيء آخر…».
- عندما يكتمل الدرع يلمع، ويظهر احتفال.

## كل أسبوع
- شريط **هدف الفريق** يجمع القطع السليمة لكل الأطفال من الأحد إلى اليوم.
- حدد الهدف واسمه (مثل «خروجة عائلية») من صفحة الوالدين.

## الجوائز اليومية (اختيارية)
- عندما ينهي الجميع مهام الروتين يظهر زر صغير للجوائز.
- يُرتَّب الاختيار بعدد **الأفعال القوية فقط**، حتى لا يكسب طفل بسبب خطأ أخيه.

## أين تُحفظ بياناتك؟
لا يوجد حساب ولا تسجيل دخول، ولا تُرسَل بياناتك أو بيانات أطفالك إلى أي مكان. كل شيء يُحفظ **داخل المتصفح على جهازك**. لذلك:
- إذا أغلقت الصفحة وعدت إليها من **الجهاز والمتصفح نفسيهما** تجد كل شيء كما تركته.
- التقدّم **لا ينتقل تلقائيًا** بين الأجهزة، ولا بين متصفحين على الجهاز نفسه (مثل Chrome وSafari).
- تضيع البيانات إذا **مسحت بيانات المتصفح** (السجل وملفات تعريف الارتباط وبيانات المواقع).
- لا تستخدم **التصفح الخاص / المتخفي (Incognito)**، فهو لا يحفظ شيئًا بعد إغلاقه.
- على **آيفون وآيباد (Safari)**: قد يحذف المتصفح بيانات المواقع التي لم تُفتح لعدة أيام. الاستخدام اليومي يحميها، والنسخة الاحتياطية تضمنها.
- احفظ الصفحة بالرابط نفسه دائمًا (أضفها إلى المفضلة أو الشاشة الرئيسية)، لأن البيانات مرتبطة بعنوان الصفحة.

## تنزيل الصفحة كملف (للكمبيوتر)
- من آخر هذا الدليل اضغط «⬇️ تنزيل الصفحة»، فيُحفظ ملف واحد اسمه «الدرع.html» تفتحه بالمتصفح في أي وقت، حتى دون إنترنت.
- على الهاتف استخدم التثبيت بدلًا منه، لأن تطبيق الملفات قد يفتح الصفحة في معاينة لا تحفظ البيانات.
- لنقل تقدّمك بين الرابط والملف، استخدم النسخة الاحتياطية.

## النسخة الاحتياطية
من «⚙️ للوالدين» ← «💾 النسخة الاحتياطية»:
1. **تنزيل ملف النسخة:** يحفظ كل التقدّم في ملف صغير على جهازك. إذا لم يبدأ التنزيل، استخدم «نسخ النسخة كنص» والصقه في الملاحظات أو أرسله لنفسك.
2. **الاسترجاع:** على الجهاز الجديد افتح الصفحة، ثم «استرجاع من ملف» أو الصق النص واضغط «استرجاع من النص».
3. الاسترجاع **يستبدل** كل ما على الجهاز بالنسخة، فتأكد أنها الأحدث.

ننصح بتنزيل نسخة **مرة في الأسبوع** على الأقل.

## ملاحظات
- استخدم جهازًا واحدًا في الوقت نفسه، وانقل التقدّم بالنسخة الاحتياطية إن غيّرت الجهاز.
- أي فعل سُجّل خطأً يمكن حذفه من «سجل اليوم» في صفحة الوالدين.
